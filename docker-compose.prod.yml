version: "3.8"

services:
  acounorm-frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: acounorm-frontend:latest
    container_name: acounorm-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=https://seu-dominio.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GITHUB_ID=${GITHUB_ID}
      - GITHUB_SECRET=${GITHUB_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - NEXT_PUBLIC_API_URL=https://api.seu-dominio.com
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - acounorm-network
    labels:
      - "com.example.description=AcouNorm Frontend"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  acounorm-backend:
    image: acounorm-backend:latest
    container_name: acounorm-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - acounorm-network
    labels:
      - "com.example.description=AcouNorm Backend API"

  nginx:
    image: nginx:alpine
    container_name: acounorm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - acounorm-frontend
      - acounorm-backend
    restart: unless-stopped
    networks:
      - acounorm-network
    labels:
      - "com.example.description=Nginx Reverse Proxy"

networks:
  acounorm-network:
    driver: bridge
